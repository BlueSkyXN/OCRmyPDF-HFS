name: Deploy OCRmyPDF HFS wrapper

on:
  workflow_dispatch:
    inputs:
      target:
        description: Explicit HFS manifest profile
        required: true
        type: choice
        options:
          - candidate
          - production
      source_ref:
        description: Full immutable 40-character source commit to deploy
        required: true
        type: string
      confirm_deploy:
        description: Type deploy to confirm the remote Space write
        required: true
        default: "no"
        type: choice
        options:
          - "no"
          - deploy

permissions:
  contents: read

jobs:
  deploy-wrapper:
    if: inputs.confirm_deploy == 'deploy'
    runs-on: ubuntu-latest
    environment: hfs-production
    env:
      HFS_TARGET: ${{ inputs.target }}
      HFS_MANIFEST: ${{ inputs.target == 'candidate' && 'hfs-dev.candidate.toml' || 'hfs-dev.toml' }}
    steps:
      - name: Check out the requested immutable source commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0

      - name: Verify source provenance and wrapper boundary
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          [[ "${SOURCE_REF}" =~ ^[0-9a-f]{40}$ ]] || {
            printf '%s\n' 'source_ref must be a full lowercase 40-character commit.' >&2
            exit 2
          }
          # GITHUB_SHA identifies the workflow event's default-branch revision for
          # workflow_dispatch, not necessarily the explicitly requested deployment ref.
          test "$(git rev-parse HEAD)" = "${SOURCE_REF}"
          base_tag=$(sed -n 's/^ARG PYTHON_BASE_IMAGE=//p' cloud/hfs/Dockerfile)
          [[ "$base_tag" =~ ^[^@[:space:]]+$ ]]
          digest=$(docker buildx imagetools inspect "$base_tag" --format '{{.Manifest.Digest}}')
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          cloud/hfs/export_space_bundle.sh \
            --source-ref "${SOURCE_REF}" \
            --base-image "$base_tag@$digest" \
            --manifest "$HFS_MANIFEST" \
            --output "${RUNNER_TEMP}/ocrmypdf-hfs-space"

      - name: Set up the deployment client
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Publish wrapper and read back the Space tree
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "huggingface_hub==1.5.0" "click==8.3.1"
          python -m huggingface_hub.cli.hf version
          python -m huggingface_hub.cli.hf --help >/dev/null
          SPACE_ID=$(python -c 'import tomllib; print(tomllib.load(open("'"$HFS_MANIFEST"'", "rb"))["space"])')
          private_flag=()
          if [ "$HFS_TARGET" = candidate ]; then private_flag+=(--require-private); fi
          PYTHONDONTWRITEBYTECODE=1 python cloud/hfs/sync_space_bundle.py \
            --bundle "${RUNNER_TEMP}/ocrmypdf-hfs-space" \
            --space "$SPACE_ID" \
            --source-ref "${SOURCE_REF}" \
            --apply "${private_flag[@]}"

      - name: Record follow-up runtime gate
        run: |
          cat <<'EOF'
          Deployment write/readback completed. Before accepting the release, an owner must
          run test/test.py with the approved OCR corpus against the Space, compare it with
          the captured legacy baseline, and retain the results as release evidence.
          EOF
